<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환경과 생태 쫌 아는 10대</title>
  
  <!-- Pico CSS 어두운 테마 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

  <style>
    body {
      background-color: #111827;
      color: #f3f4f6;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #1f2937;
    }

    /* 사이드바 스타일 */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
    }
    .sidebar-overlay.active { display: block; }
    
    .sidebar {
      position: fixed;
      top: 0; left: -280px; width: 280px; height: 100%;
      background-color: #1f2937;
      z-index: 101;
      padding: 1.5rem;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sidebar.active { left: 0; }
    .sidebar button {
      background: transparent;
      border: 1px solid #374151;
      color: #f3f4f6;
      text-align: left;
      width: 100%;
      margin: 0;
    }
    .sidebar button:hover {
      background-color: #06b6d4;
      border-color: #06b6d4;
    }

    /* 폼 카드 */
    .auth-card {
      max-width: 450px;
      margin: 4rem auto;
      padding: 2rem;
      background-color: #1f2937;
      border-radius: 12px;
      border: 1px solid #374151;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      background-color: #111827;
      border: 1px solid #374151;
      color: #fff;
      margin-bottom: 1rem;
    }

    .btn-cyan {
      background-color: #06b6d4;
      border: none;
      color: #fff;
      font-weight: bold;
    }
    .btn-cyan:hover {
      background-color: #0891b2;
    }

    .btn-google {
      background-color: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      font-weight: bold;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-google:hover {
      background-color: #f1f1f1;
      color: #000;
    }

    .toggle-link {
      color: #38bdf8;
      cursor: pointer;
      text-decoration: underline;
    }

    .page-content { display: none; }
    .page-content.active { display: block; }
  </style>

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3vpk4KQ8cUykmEh-OrrfvMlqKZdRpc-8",
      authDomain: "bugur-king.firebaseapp.com",
      databaseURL: "https://bugur-king-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bugur-king",
      storageBucket: "bugur-king.firebasestorage.app",
      messagingSenderId: "550291650663",
      appId: "1:550291650663:web:0f66287087dc0bfc487cc2",
      measurementId: "G-LCSTLKGLJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      const userInfoDiv = document.getElementById('user-info');
      const sidebarForumBtn = document.getElementById('sidebar-forum-btn');
      const sidebarRankBtn = document.getElementById('sidebar-rank-btn');

      if (user) {
        currentUser = user;
        userInfoDiv.innerHTML = `👤 ${user.displayName || user.email}님 <button onclick="window.handleLogout()" style="padding:4px 10px; margin-left:10px; font-size:0.8rem;" class="secondary">로그아웃</button>`;
        
        // 로그인 성공 시 사이드바 메뉴 활성화
        sidebarForumBtn.style.display = 'block';
        sidebarRankBtn.style.display = 'block';

        // 메인 인증화면 숨기고 자유 포럼 페이지로 이동
        document.getElementById('auth-section').style.display = 'none';
        showPage('forum-page');
      } else {
        currentUser = null;
        userInfoDiv.innerText = "🔒 로그인 필요";
        
        // 비로그인 시 사이드바 포럼/랭킹 숨김
        sidebarForumBtn.style.display = 'none';
        sidebarRankBtn.style.display = 'none';

        // 로그인 창 표시
        document.getElementById('auth-section').style.display = 'block';
        showPage('auth-section');
      }
    });

    // 폼 전환 (로그인 <-> 회원가입)
    window.toggleAuthView = (view) => {
      if(view === 'signup') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('signup-box').style.display = 'block';
      } else {
        document.getElementById('signup-box').style.display = 'none';
        document.getElementById('login-box').style.display = 'block';
      }
    };

    // 🌐 구글 로그인 처리
    window.handleGoogleLogin = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (e) {
        alert("구글 로그인 실패: " + e.message);
      }
    };

    // 회원가입 처리
    window.handleSignup = async () => {
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-pass').value;
      const nickname = document.getElementById('signup-nick').value;
      if (!email || !pass || !nickname) return alert("모든 정보를 입력하세요.");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(res.user, { displayName: nickname });
        alert("회원가입 완료!");
      } catch (e) { alert("가입 실패: " + e.message); }
    };

    // 이메일 로그인 처리
    window.handleLogin = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      if (!email || !pass) return alert("아이디와 비밀번호를 입력하세요.");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) { alert("로그인 실패: 비밀번호 또는 이메일을 확인해 주세요."); }
    };

    // 로그아웃
    window.handleLogout = () => signOut(auth);

    // 포럼 글쓰기
    window.submitForum = async () => {
      if (!currentUser) return alert("로그인이 필요합니다.");
      const content = document.getElementById('forum-input').value;
      if (!content) return;

      const postsRef = ref(db, 'posts');
      await push(postsRef, {
        author: currentUser.displayName || currentUser.email,
        content: content,
        timestamp: Date.now()
      });
      document.getElementById('forum-input').value = '';
    };

    // 포럼 실시간 데이터 로드
    const postsRef = ref(db, 'posts');
    onValue(postsRef, (snapshot) => {
      const data = snapshot.val();
      const div = document.getElementById('forum-list');
      if (!data) { div.innerHTML = '<p>작성된 게시물이 없습니다.</p>'; return; }
      
      const posts = Object.values(data).reverse();
      div.innerHTML = posts.map(p => `
        <article style="padding:15px; margin-bottom:12px; background-color:#1f2937; border:1px solid #374151; border-radius:8px;">
          <strong style="color:#38bdf8;">👤 ${p.author}</strong>
          <p style="margin-top:5px; margin-bottom:0;">${p.content}</p>
        </article>
      `).join('');
    });
  </script>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div style="display:flex; align-items:center; gap:1rem;">
      <button onclick="toggleSidebar()" class="secondary" style="margin:0; padding:4px 12px;">☰ 메뉴</button>
      <h3 style="margin:0; color:#06b6d4;">🌱 환경과 생태 쫌 아는 10대</h3>
    </div>
    <div id="user-info">🔒 로그인 확인 중...</div>
  </header>

  <!-- 사이드바 -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4 style="margin:0;">메뉴</h4>
      <button onclick="toggleSidebar()" style="width:auto; padding:2px 8px; border:none;">✕</button>
    </div>
    <hr style="margin:0; border-color:#374151;">
    
    <!-- 로그인 후 표시되는 메뉴 -->
    <button id="sidebar-forum-btn" onclick="showPage('forum-page'); toggleSidebar();" style="display:none;">💬 자유 포럼</button>
    <button id="sidebar-rank-btn" onclick="showPage('rank-page'); toggleSidebar();" style="display:none;">🏆 실시간 랭킹</button>
  </div>

  <div class="container" style="margin-top:2rem;">
    <!-- 1. 로그인 / 회원가입 세션 -->
    <div id="auth-section">
      <!-- 로그인 폼 -->
      <div id="login-box" class="auth-card">
        <h3>로그인</h3>
        <input type="email" id="login-email" placeholder="이메일">
        <input type="password" id="login-pass" placeholder="비밀번호">
        <button onclick="handleLogin()" class="btn-cyan">로그인</button>
        
        <!-- 구글 로그인 버튼 -->
        <button onclick="handleGoogleLogin()" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google 계정으로 로그인
        </button>

        <p style="text-align:center; margin-top:1.5rem; margin-bottom:0; font-size:0.9rem;">
          계정이 없으신가요? <span class="toggle-link" onclick="toggleAuthView('signup')">회원가입</span>
        </p>
      </div>

      <!-- 회원가입 폼 -->
      <div id="signup-box" class="auth-card" style="display:none;">
        <h3>회원가입</h3>
        <input type="email" id="signup-email" placeholder="이메일">
        <input type="password" id="signup-pass" placeholder="비밀번호">
        <input type="text" id="signup-nick" placeholder="닉네임">
        <button onclick="handleSignup()" class="btn-cyan">가입하기</button>
        
        <!-- 구글 가입/로그인 버튼 -->
        <button onclick="handleGoogleLogin()" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google 계정으로 시작하기
        </button>

        <p style="text-align:center; margin-top:1.5rem; margin-bottom:0; font-size:0.9rem;">
          이미 계정이 있으신가요? <span class="toggle-link" onclick="toggleAuthView('login')">로그인</span>
        </p>
      </div>
    </div>

    <!-- 2. 자유 포럼 페이지 -->
    <div id="forum-page" class="page-content">
      <h2>💬 자유 포럼</h2>
      <div style="background:#1f2937; padding:1.5rem; border-radius:12px; margin-bottom:2rem; border:1px solid #374151;">
        <input type="text" id="forum-input" placeholder="의견을 남겨주세요">
        <button onclick="submitForum()" class="btn-cyan" style="width:100%;">글 등록</button>
      </div>
      <div id="forum-list"></div>
    </div>

    <!-- 3. 랭킹 페이지 -->
    <div id="rank-page" class="page-content">
      <h2>🏆 실시간 랭킹</h2>
      <article style="background:#1f2937; border:1px solid #374151;">
        <p>준비 중인 페이지입니다.</p>
      </article>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function showPage(pageId) {
      document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(pageId);
      if(target) target.classList.add('active');
    }
  </script>
</body>
</html>
