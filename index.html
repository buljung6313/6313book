<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환경과 생태 쫌 아는 10대</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  
  <!-- Firebase SDK (CDN 방식) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 💡 발급받으신 Firebase 설정 적용
    const firebaseConfig = {
      apiKey: "AIzaSyB3vpk4KQ8cUykmEh-OrrfvMlqKZdRpc-8",
      authDomain: "bugur-king.firebaseapp.com",
      databaseURL: "https://bugur-king-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bugur-king",
      storageBucket: "bugur-king.firebasestorage.app",
      messagingSenderId: "550291650663",
      appId: "1:550291650663:web:0f66287087dc0bfc487cc2",
      measurementId: "G-LCSTLKGLJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      const userInfoDiv = document.getElementById('user-info');
      if (user) {
        currentUser = user;
        userInfoDiv.innerHTML = `👤 ${user.displayName || user.email}님 <button onclick="window.handleLogout()" style="padding:4px 8px; margin-left:10px;">로그아웃</button>`;
      } else {
        currentUser = null;
        userInfoDiv.innerText = "🔒 로그인 필요";
      }
    });

    // 회원가입
    window.handleSignup = async () => {
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-pass').value;
      const nickname = document.getElementById('signup-nick').value;
      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(res.user, { displayName: nickname });
        alert("회원가입 성공!");
      } catch (e) { alert(e.message); }
    };

    // 로그인
    window.handleLogin = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        alert("로그인 성공!");
      } catch (e) { alert("로그인 실패: " + e.message); }
    };

    // 로그아웃
    window.handleLogout = () => signOut(auth);

    // 포럼 글 작성
    window.submitForum = async () => {
      if (!currentUser) return alert("로그인 후 이용 가능합니다.");
      const content = document.getElementById('forum-input').value;
      if (!content) return;

      const postsRef = ref(db, 'posts');
      await push(postsRef, {
        author: currentUser.displayName || currentUser.email,
        content: content,
        timestamp: Date.now()
      });
      document.getElementById('forum-input').value = '';
    };

    // 포럼 실시간 불러오기
    const postsRef = ref(db, 'posts');
    onValue(postsRef, (snapshot) => {
      const data = snapshot.val();
      const div = document.getElementById('forum-list');
      if (!data) { div.innerHTML = '등록된 글이 없습니다.'; return; }
      
      const posts = Object.values(data).reverse();
      div.innerHTML = posts.map(p => `<article style="padding:10px; margin-bottom:10px;"><strong>${p.author}</strong>: ${p.content}</article>`).join('');
    });
  </script>
</head>
<body class="container">
  <header style="margin-bottom: 20px;">
    <h1>🌱 환경과 생태 워크북</h1>
    <div id="user-info">🔒 로그인 확인 중...</div>
  </header>

  <main>
    <section class="grid">
      <div>
        <h4>로그인</h4>
        <input type="email" id="login-email" placeholder="이메일">
        <input type="password" id="login-pass" placeholder="비밀번호">
        <button onclick="handleLogin()">로그인</button>
      </div>
      <div>
        <h4>회원가입</h4>
        <input type="email" id="signup-email" placeholder="이메일">
        <input type="password" id="signup-pass" placeholder="비밀번호">
        <input type="text" id="signup-nick" placeholder="닉네임">
        <button onclick="handleSignup()">가입하기</button>
      </div>
    </section>

    <section>
      <h3>💬 온라인 포럼</h3>
      <input type="text" id="forum-input" placeholder="의견을 남겨주세요">
      <button onclick="submitForum()">글 등록</button>
      <div id="forum-list"></div>
    </section>
  </main>
</body>
</html>
